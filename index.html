<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyLite DSA Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar glass">
      <button id="menu-btn" class="icon-btn glass" title="Menu">☰</button>

      <div class="workspace-tabs" id="tab-strip"></div>

      <div class="topbar-actions">
        <button id="run-btn" class="icon-btn glass action action-run" title="Run Python">▶</button>
        <button id="stop-btn" class="icon-btn glass action action-stop" title="Stop">■</button>
        <button id="save-btn" class="icon-btn glass" title="Save (Ctrl+S)">💾</button>
        <button id="live-btn" class="pill-btn glass" title="Toggle live mode">LIVE</button>
        <button id="notebook-btn" class="icon-btn glass" title="Notebook">📝</button>
      </div>

      <div id="menu-popover" class="menu-popover glass hidden">
        <button id="toggle-tree-btn" class="menu-item">Toggle File Tree</button>
        <button data-bg="solid" class="menu-item bg-mode">Solid Dark Mode</button>
        <button data-bg="wallpaper" class="menu-item bg-mode">Wallpaper Mode</button>
        <label class="menu-item file-label" for="wallpaper-input">Set Wallpaper</label>
        <input id="wallpaper-input" type="file" accept="image/*" />
      </div>
    </header>

    <main class="workspace-area">
      <aside id="file-tree-panel" class="file-tree glass"></aside>

      <section class="editor-zone">
        <div class="editor-wrap glass" id="editor-wrap">
          <textarea id="editor" spellcheck="false" placeholder="# Open or create a Python file\nprint('Hello, DSA learner!')"></textarea>
        </div>
        <div id="context-menu" class="context-menu glass hidden">
          <button data-action="run-selection">Run Selection</button>
          <button data-action="save-note">Save as Note</button>
          <button data-action="stop">Stop</button>
          <button data-action="toggle-live">Toggle Live Mode</button>
        </div>

        <section class="output-panel glass">
          <div class="output-head">
            <span>OUTPUT</span>
            <span id="run-status" class="run-status">IDLE</span>
          </div>
          <pre id="output"></pre>
        </section>
      </section>
    </main>

    <aside id="notebook-drawer" class="notebook-drawer glass hidden">
      <div class="notebook-head">
        <h2>DSA Notes</h2>
        <div class="notebook-actions">
          <button id="add-category-btn" class="pill-btn glass">+ Category</button>
          <button id="add-note-btn" class="pill-btn glass">+ Note</button>
          <label class="expand-toggle"><input id="expand-all" type="checkbox" /> Expand all</label>
        </div>
      </div>
      <div id="notes-container" class="notes-container"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
